<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Learn Orthodoxy social card</title>
<!-- Source of orthodox-site/public/og-image.png (1200x630). Rendered by og-image.mjs (UI-010, UI-014).
     It carries no cross, so it stays valid whichever cross lib/brand.ts selects. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=EB+Garamond:ital,wght@0,500;1,400&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #f8f3ea;
    --ink: #3b2d1b;
    --umber: #4b3a22;
    --soft: #5e4d36;
    --accent: #8e2a1e;
    --rule: rgba(134, 100, 38, 0.55);
  }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    color: var(--ink);
  }
  /* A printed page: double gold rule around the text block. */
  .card {
    position: relative;
    box-sizing: border-box;
    width: 1200px;
    height: 630px;
    padding: 70px 96px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    border: 1px solid var(--rule);
    pointer-events: none;
  }
  .card::before { inset: 26px; }
  .card::after { inset: 32px; }
  .wordmark { display: block; width: 660px; height: auto; }
  .ar {
    margin: 22px 0 0;
    font-family: "Amiri", serif;
    font-size: 46px;
    line-height: 1.3;
    color: var(--umber);
    direction: rtl;
  }
  .ornament {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 300px;
    margin: 18px 0 20px;
  }
  .ornament span { flex: 1; height: 1px; background: var(--rule); }
  .ornament i {
    width: 9px;
    height: 9px;
    background: var(--accent);
    transform: rotate(45deg);
  }
  .lead {
    margin: 0;
    max-width: 820px;
    font-family: "EB Garamond", serif;
    font-style: italic;
    font-size: 33px;
    line-height: 1.3;
    color: var(--soft);
  }
  .url {
    margin: 22px 0 0;
    font-family: "EB Garamond", serif;
    font-weight: 500;
    font-size: 24px;
    font-variant-caps: all-small-caps;
    letter-spacing: 0.12em;
    color: var(--umber);
  }
</style>
</head>
<body>
  <div class="card">
    <img class="wordmark" src="WORDMARK_SRC" alt="Learn Orthodoxy — A Coptic Orthodox Study Guide">
    <p class="ar">تعلّم الأرثوذكسية</p>
    <div class="ornament"><span></span><i></i><span></span></div>
    <p class="lead">Questions on the faith and the saints, answered from Fr. Tadros Malaty’s books and the Coptic catechism, with book and page cited.</p>
    <p class="url">learnorthodoxy.net</p>
  </div>
</body>
</html>
